name: Accessibility Mobile Fix

on:
  push:
    branches: [fix/accessibility-mobile]
    paths: [.github/workflows/accessibility-mobile-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accessibility-mobile
          fetch-depth: 0
      - name: Update viewport
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'; assert old in s; p.write_text(s.replace(old,'width=device-width, initial-scale=1.0, viewport-fit=cover',1))"
      - name: Append accessibility CSS
        run: |
          printf '%s\n' '' '/* ACCESSIBILITY MOBILE 2026 */' ':where(button, [role="button"], a, input, select, textarea):focus-visible {' '  outline: 3px solid var(--accent-light-blue, #58b8ff);' '  outline-offset: 3px;' '}' '' ':where(button, [role="button"], input[type="button"], input[type="submit"], input[type="reset"], select) {' '  min-height: 44px;' '}' '' '@media (max-width: 768px) {' '  :where(button, [role="button"], .chip, .filter-chip, .map-control, .nav-item) {' '    min-width: 44px;' '    min-height: 44px;' '  }' '  input, select, textarea {' '    font-size: 16px;' '  }' '}' '' '@media (prefers-reduced-motion: reduce) {' '  *, *::before, *::after {' '    scroll-behavior: auto !important;' '    animation-duration: 0.01ms !important;' '    animation-iteration-count: 1 !important;' '    transition-duration: 0.01ms !important;' '  }' '}' >> styles/app.css
      - name: Add regression test
        run: python -c "from pathlib import Path; p=Path('tests/project-structure.test.mjs'); s=p.read_text(); marker=\"test('spot rapido usa le coordinate GPS ricevute'\"; block=\"test('viewport e controlli mobile restano accessibili', async () => {\\n  const html = await read('index.html');\\n  const css = await read('styles/app.css');\\n  assert.doesNotMatch(html, /user-scalable=no|maximum-scale=1\\\\.0/);\\n  assert.match(css, /:focus-visible/);\\n  assert.match(css, /min-height:\\\\s*44px/);\\n  assert.match(css, /prefers-reduced-motion:\\\\s*reduce/);\\n});\\n\\n\"; assert marker in s; p.write_text(s.replace(marker,block+marker,1))"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run tests
        run: |
          npm ci
          npm test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/accessibility-mobile.yml .github/workflows/accessibility-mobile-fix.yml
          git add index.html styles/app.css tests/project-structure.test.mjs .github/workflows/accessibility-mobile.yml .github/workflows/accessibility-mobile-fix.yml
          git commit -m "Improve mobile accessibility and touch targets"
          git push origin HEAD:fix/accessibility-mobile
