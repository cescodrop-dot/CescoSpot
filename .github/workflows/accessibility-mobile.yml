name: Improve Mobile Accessibility

on:
  push:
    branches:
      - fix/accessibility-mobile
    paths:
      - .github/workflows/accessibility-mobile.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accessibility-mobile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply accessibility improvements
        run: |
          python <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text()
          old = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
          new = 'width=device-width, initial-scale=1.0, viewport-fit=cover'
          if old not in text:
              raise SystemExit('Expected viewport declaration not found')
          index.write_text(text.replace(old, new, 1))

          css = Path('styles/app.css')
          text = css.read_text()
          marker = '/* ACCESSIBILITY MOBILE 2026 */'
          lines = [
              '', '', marker,
              ':where(button, [role="button"], a, input, select, textarea):focus-visible {',
              '  outline: 3px solid var(--accent-light-blue, #58b8ff);',
              '  outline-offset: 3px;',
              '}', '',
              ':where(button, [role="button"], input[type="button"], input[type="submit"], input[type="reset"], select) {',
              '  min-height: 44px;',
              '}', '',
              '@media (max-width: 768px) {',
              '  :where(button, [role="button"], .chip, .filter-chip, .map-control, .nav-item) {',
              '    min-width: 44px;',
              '    min-height: 44px;',
              '  }', '',
              '  input,', '  select,', '  textarea {',
              '    font-size: 16px;',
              '  }',
              '}', '',
              '@media (prefers-reduced-motion: reduce) {',
              '  *,', '  *::before,', '  *::after {',
              '    scroll-behavior: auto !important;',
              '    animation-duration: 0.01ms !important;',
              '    animation-iteration-count: 1 !important;',
              '    transition-duration: 0.01ms !important;',
              '  }',
              '}', ''
          ]
          if marker not in text:
              css.write_text(text.rstrip() + '\n'.join(lines))

          tests = Path('tests/project-structure.test.mjs')
          text = tests.read_text()
          marker_test = "test('spot rapido usa le coordinate GPS ricevute'"
          block = """test('viewport e controlli mobile restano accessibili', async () => {\n  const html = await read('index.html');\n  const css = await read('styles/app.css');\n\n  assert.doesNotMatch(html, /user-scalable=no|maximum-scale=1\\.0/);\n  assert.match(css, /:focus-visible/);\n  assert.match(css, /min-height:\\s*44px/);\n  assert.match(css, /prefers-reduced-motion:\\s*reduce/);\n  assert.match(css, /font-size:\\s*16px/);\n});\n\n"""
          if 'viewport e controlli mobile restano accessibili' not in text:
              text = text.replace(marker_test, block + marker_test)
          tests.write_text(text)
          PY
      - name: Run tests
        run: |
          npm ci
          npm test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/accessibility-mobile.yml
          git add index.html styles/app.css tests/project-structure.test.mjs .github/workflows/accessibility-mobile.yml
          git commit -m "Improve mobile accessibility and touch targets"
          git push origin HEAD:fix/accessibility-mobile
